name: Publish
on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: "@swisspost-devs"
  GIT_AUTHOR_EMAIL: "oss@post.ch"
  GIT_COMMITTER_NAME: "swisspost-devs"
  GIT_COMMITTER_EMAIL: "oss@post.ch"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write          # GitHub releases / comments
      issues: write
      pull-requests: write
      id-token: write          # REQUIRED for OIDC / trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'  # important for npm

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm i node@v20-lts --no-save

      # Trusted publishing requires npm 11.5.1 or later.
      - name: Update NPM for trusted publishing
        run: |
          npm update -g npm
          echo "npm: $(npm -v)"

      - name: Release (dry-run)
        if: github.event_name == 'pull_request'
        run: npm publish --dry-run --provenance

      - name: Release
        if: github.event_name == 'push'
        run: npm publish --provenance
